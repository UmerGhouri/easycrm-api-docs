name: Build API docs

on:
  push:
    branches: [main]
  # EasyCRM fires this when docs/api-integration or the spec changes, so an edit is live in
  # about a minute instead of waiting for the cron below.
  repository_dispatch:
    types: [docs-updated]
  # Safety net, and in practice the main trigger until the dispatch is wired up.
  #
  # :23 rather than :00 on purpose. GitHub queues scheduled runs and drops them under load,
  # and the top of the hour is the most contended slot on the platform.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

# Publishing is opt-in. The deploy job is skipped unless the repo variable PUBLISH_TARGET is
# set to "github-pages", so the site can be built and inspected before it has a URL at all.
#
# This site is PUBLIC and indexable by design - it documents a customer-facing API. Setting
# that variable is the moment it becomes readable by anyone, so do it deliberately.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: easycrm-api-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # DOCS_ORG, not GITHUB_ORG: GitHub Actions reserves the GITHUB_ prefix and will not let
      # you create a variable with that name.
      - name: Fetch the API docs from EasyCRM
        env:
          DOCS_ORG: ${{ vars.DOCS_ORG }}
          DOCS_REPO: ${{ vars.DOCS_REPO }}
          DOCS_BRANCH: ${{ vars.DOCS_BRANCH }}
          # Fine-grained PAT with Contents: Read on EasyCRM ONLY. The built-in GITHUB_TOKEN
          # cannot read another repo, which is why this secret exists.
          DOCS_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run fetch

      - name: Generate the API reference
        run: npm run gen-api

      - name: Build
        env:
          # The ORIGIN. Set this to the custom domain once there is one.
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          # The PATH under that origin, and the one people forget. A GitHub Pages project site
          # is served from /<repo>/; a custom domain is served from /. Getting this wrong makes
          # every asset resolve one directory too high and the site 404s with no error anywhere.
          # Passed as a variable so moving to the customer's domain needs no commit.
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
        run: npx docusaurus build

      - name: Upload Pages artifact
        if: vars.PUBLISH_TARGET == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: vars.PUBLISH_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
